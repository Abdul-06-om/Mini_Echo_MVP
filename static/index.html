<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini ECHO</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 960px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 {
    font-size: 1.25rem;
  }
  #app-layout {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }
  #avatar-panel {
    width: 300px;
    flex-shrink: 0;
    text-align: center;
  }
  #avatar-video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #222;
    border: 3px solid #4a90a4;
  }
  #avatar-video-wrap img,
  #avatar-video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #avatar-video-wrap img {
    object-position: 35% 20%;
  }
  #avatar-video-wrap video {
    object-position: center;
  }
  #avatar-state-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 0.75rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    text-transform: capitalize;
  }
  #avatar-panel[data-state="speaking"] #avatar-video-wrap {
    box-shadow: 0 0 0 4px rgba(74, 144, 164, 0.5);
  }
  #avatar-panel[data-state="thinking"] #avatar-state-badge {
    background: rgba(180, 140, 0, 0.85);
  }
  #avatar-panel[data-state="error"] #avatar-state-badge {
    background: rgba(180, 0, 0, 0.85);
  }
  #avatar-panel[data-state="connecting"] #avatar-state-badge {
    background: rgba(90, 90, 90, 0.85);
  }
  .persona-name {
    font-weight: 600;
    font-size: 1.05rem;
    margin-top: 0.6rem;
  }
  .persona-role {
    color: #555;
    font-size: 0.9rem;
  }
  .voice-label {
    display: block;
    font-size: 0.8rem;
    color: #555;
    margin-top: 0.5rem;
  }
  #chat-panel {
    flex: 1;
    min-width: 0;
  }
  #disclaimer {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    color: #664d03;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    height: 400px;
    overflow-y: auto;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .message {
    margin-bottom: 0.75rem;
  }
  .message.user {
    text-align: right;
  }
  .message.ai {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .message.ai .avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
    object-position: 35% 20%;
    border: 2px solid #4a90a4;
  }
  .message .bubble {
    display: inline-block;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    max-width: 80%;
  }
  .message.user .bubble {
    background: #d1e7ff;
  }
  .message.ai .bubble {
    background: #f0f0f0;
  }
  .message.error .bubble {
    background: #ffe0e0;
    color: #900;
  }
  form {
    display: flex;
    gap: 0.5rem;
  }
  input {
    flex: 1;
    padding: 0.5rem;
  }
  button {
    padding: 0.5rem 1rem;
  }
  @media (max-width: 700px) {
    #app-layout {
      flex-direction: column;
    }
    #avatar-panel {
      width: 100%;
    }
    #avatar-video-wrap {
      max-width: 280px;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>
  <h1>Mini ECHO</h1>
  <div id="app-layout">
    <div id="avatar-panel" data-state="connecting">
      <div id="avatar-video-wrap">
        <img id="avatar-poster" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
        <video id="avatar-video" autoplay playsinline hidden></video>
        <audio id="avatar-audio" autoplay></audio>
        <span id="avatar-state-badge">connecting</span>
      </div>
      <div class="persona-name">Dr. Sarah Chen</div>
      <div class="persona-role">General Practitioner</div>
      <label class="voice-label">Voice: <select id="voice-select"></select></label>
    </div>
    <div id="chat-panel">
      <div id="disclaimer">This is an AI roleplay for practice only — not real medical advice. In a real emergency, contact emergency services immediately.</div>
      <div id="chat"></div>
      <form id="chat-form">
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <template id="avatar-template">
    <img class="avatar" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
  </template>

  <script src="/static/dist/avatar-bundle.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const button = form.querySelector('button');
    const avatarTemplate = document.getElementById('avatar-template');
    const voiceSelect = document.getElementById('voice-select');
    const avatarVideo = document.getElementById('avatar-video');
    const avatarAudio = document.getElementById('avatar-audio');
    const avatarPoster = document.getElementById('avatar-poster');
    const avatarPanel = document.getElementById('avatar-panel');
    const avatarStateBadge = document.getElementById('avatar-state-badge');
    let isSending = false;
    let conversation = [];
    let voices = [];

    console.log('[page] MiniEchoAvatar bundle loaded:', typeof MiniEchoAvatar !== 'undefined');

    const avatar = new MiniEchoAvatar.DoctorAvatar({
      videoEl: avatarVideo,
      audioEl: avatarAudio,
      panelEl: avatarPanel,
      stateEl: avatarStateBadge,
    });

    avatarVideo.addEventListener('playing', () => {
      console.log('[page] video element fired "playing" — showing live video, hiding poster');
      avatarVideo.hidden = false;
      avatarPoster.hidden = true;
    });
    avatarVideo.addEventListener('error', (event) => {
      console.error('[page] video element error:', avatarVideo.error, event);
    });
    avatarAudio.addEventListener('play', () => {
      console.log('[page] audio element started playing');
    });
    avatarAudio.addEventListener('error', (event) => {
      console.error('[page] audio element error:', avatarAudio.error, event);
    });

    avatar.connect();

    async function populateVoices() {
      try {
        const response = await fetch('/voices');
        if (!response.ok) throw new Error('Failed to load voices');
        voices = await response.json();
      } catch (error) {
        console.error('Failed to load voices', error);
        voices = [];
      }

      voiceSelect.replaceChildren();
      voices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voice_id;
        option.textContent = voice.name;
        voiceSelect.appendChild(option);
      });

      const savedVoiceId = localStorage.getItem('voiceId');
      if (savedVoiceId && voices.some((v) => v.voice_id === savedVoiceId)) {
        voiceSelect.value = savedVoiceId;
      }
    }

    voiceSelect.addEventListener('change', () => {
      localStorage.setItem('voiceId', voiceSelect.value);
    });

    populateVoices();

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'ai') {
        div.appendChild(avatarTemplate.content.cloneNode(true));
      }

      const bubble = document.createElement('span');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (isSending) return;

      const message = input.value.trim();
      if (!message) return;

      isSending = true;
      input.disabled = true;
      button.disabled = true;

      try {
        conversation.push({ role: 'user', content: message });
        addMessage(message, 'user');
        input.value = '';
        avatar.think();

        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation }),
        });

        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }

        const data = await response.json();
        conversation.push({ role: 'assistant', content: data.reply });
        addMessage(data.reply, 'ai');
        avatar.speak(data.reply, voiceSelect.value);
      } catch (error) {
        conversation.pop();
        addMessage('Something went wrong. Please try again.', 'error');
      } finally {
        isSending = false;
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
