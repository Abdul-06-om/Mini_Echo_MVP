<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini ECHO</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 {
    font-size: 1.25rem;
  }
  #persona-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.35rem;
    margin-bottom: 1.5rem;
  }
  .avatar {
    border-radius: 50%;
    object-fit: cover;
    object-position: 35% 20%;
    border: 3px solid #4a90a4;
  }
  #persona-header .avatar {
    width: 240px;
    height: 240px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }
  .persona-name {
    font-weight: 600;
    font-size: 1.1rem;
    margin-top: 0.5rem;
  }
  .persona-role {
    color: #555;
    font-size: 0.9rem;
  }
  #speaking-indicator {
    font-style: italic;
    color: #4a90a4;
  }
  .voice-label {
    display: block;
    font-size: 0.8rem;
    color: #555;
    margin-top: 0.25rem;
  }
  @keyframes speaking-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #persona-header .avatar.speaking {
    animation: speaking-pulse 0.6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(74, 144, 164, 0.6));
  }
  #disclaimer {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    color: #664d03;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    height: 400px;
    overflow-y: auto;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .message {
    margin-bottom: 0.75rem;
  }
  .message.user {
    text-align: right;
  }
  .message.ai {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .message.ai .avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .message .bubble {
    display: inline-block;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    max-width: 80%;
  }
  .message.user .bubble {
    background: #d1e7ff;
  }
  .message.ai .bubble {
    background: #f0f0f0;
  }
  .message.error .bubble {
    background: #ffe0e0;
    color: #900;
  }
  form {
    display: flex;
    gap: 0.5rem;
  }
  input {
    flex: 1;
    padding: 0.5rem;
  }
  button {
    padding: 0.5rem 1rem;
  }
</style>
</head>
<body>
  <h1>Mini ECHO</h1>
  <div id="persona-header">
    <img class="avatar" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
    <div class="persona-name">Dr. Sarah Chen</div>
    <div class="persona-role">General Practitioner <span id="speaking-indicator" hidden>🔊 speaking…</span></div>
    <label class="voice-label">Voice: <select id="voice-select"></select></label>
  </div>
  <div id="disclaimer">This is an AI roleplay for practice only — not real medical advice. In a real emergency, contact emergency services immediately.</div>
  <div id="chat"></div>
  <form id="chat-form">
    <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <template id="avatar-template">
    <img class="avatar" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
  </template>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const button = form.querySelector('button');
    const avatarTemplate = document.getElementById('avatar-template');
    const personaAvatar = document.querySelector('#persona-header .avatar');
    const speakingIndicator = document.getElementById('speaking-indicator');
    const voiceSelect = document.getElementById('voice-select');
    let isSending = false;
    let conversation = [];
    let voices = [];

    function populateVoices() {
      voices = speechSynthesis.getVoices();
      voiceSelect.replaceChildren();
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = voice.name + ' (' + voice.lang + ')';
        voiceSelect.appendChild(option);
      });

      const savedIndex = localStorage.getItem('voiceIndex');
      if (savedIndex !== null && voices[savedIndex]) {
        voiceSelect.value = savedIndex;
      }
    }

    if ('speechSynthesis' in window) {
      populateVoices();
      speechSynthesis.onvoiceschanged = populateVoices;
      voiceSelect.addEventListener('change', () => {
        localStorage.setItem('voiceIndex', voiceSelect.value);
      });
    } else {
      voiceSelect.disabled = true;
    }

    function setSpeaking(isSpeaking) {
      personaAvatar.classList.toggle('speaking', isSpeaking);
      speakingIndicator.hidden = !isSpeaking;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      const selectedVoice = voices[voiceSelect.value];
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      utterance.onstart = () => setSpeaking(true);
      utterance.onend = () => setSpeaking(false);
      utterance.onerror = () => setSpeaking(false);
      speechSynthesis.speak(utterance);
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'ai') {
        div.appendChild(avatarTemplate.content.cloneNode(true));
      }

      const bubble = document.createElement('span');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (isSending) return;

      const message = input.value.trim();
      if (!message) return;

      isSending = true;
      input.disabled = true;
      button.disabled = true;

      try {
        conversation.push({ role: 'user', content: message });
        addMessage(message, 'user');
        input.value = '';

        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation }),
        });

        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }

        const data = await response.json();
        conversation.push({ role: 'assistant', content: data.reply });
        addMessage(data.reply, 'ai');
        speak(data.reply);
      } catch (error) {
        conversation.pop();
        addMessage('Something went wrong. Please try again.', 'error');
      } finally {
        isSending = false;
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
