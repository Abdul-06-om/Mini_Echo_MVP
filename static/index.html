<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini ECHO</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 {
    font-size: 1.25rem;
  }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    height: 400px;
    overflow-y: auto;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .message {
    margin-bottom: 0.75rem;
  }
  .message.user {
    text-align: right;
  }
  .message .bubble {
    display: inline-block;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    max-width: 80%;
  }
  .message.user .bubble {
    background: #d1e7ff;
  }
  .message.ai .bubble {
    background: #f0f0f0;
  }
  form {
    display: flex;
    gap: 0.5rem;
  }
  input {
    flex: 1;
    padding: 0.5rem;
  }
  button {
    padding: 0.5rem 1rem;
  }
</style>
</head>
<body>
  <h1>Mini ECHO</h1>
  <p>Roleplay conversation with an AI general practitioner. This is practice only, not real medical advice.</p>
  <div id="chat"></div>
  <form id="chat-form">
    <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;
      const bubble = document.createElement('span');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      input.value = '';

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message }),
      });

      const data = await response.json();
      addMessage(data.reply, 'ai');
    });
  </script>
</body>
</html>
