<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0a0e14;
    --bg-base-2: #0d1420;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-2: rgba(255, 255, 255, 0.07);
    --panel-border: rgba(255, 255, 255, 0.09);
    --accent: #5ed4c4;
    --accent-dim: #2f8f82;
    --accent-soft: rgba(94, 212, 196, 0.16);
    --text: #e7ecf3;
    --text-dim: #8b96a8;
    --warn: #e8b34a;
    --danger: #e2685b;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(60% 50% at 18% 10%, rgba(94, 212, 196, 0.10), transparent 60%),
      radial-gradient(50% 45% at 88% 90%, rgba(47, 143, 130, 0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-base-2), var(--bg-base));
    display: flex;
    flex-direction: column;
  }

  #brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1.15rem 1.75rem;
    flex-shrink: 0;
  }
  #brand .mark {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent-soft);
  }
  #brand .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  #brand .wordmark em {
    font-style: normal;
    color: var(--text-dim);
    font-weight: 500;
  }

  #app-layout {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 2rem;
    padding: 0 1.75rem 1.75rem;
  }

  /* ---------- avatar hero ---------- */
  #avatar-panel {
    width: 44%;
    max-width: 480px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #avatar-video-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
    aspect-ratio: 3 / 4;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #0c1119;
    border: 1px solid var(--panel-border);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.75);
  }

  #avatar-video-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    pointer-events: none;
  }

  #avatar-glow {
    position: absolute;
    inset: -30%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent 70%);
    filter: blur(14px);
    opacity: 0.45;
    transition: opacity 0.6s ease;
    pointer-events: none;
    z-index: -1;
  }
  #avatar-panel[data-state="speaking"] #avatar-glow {
    opacity: 1;
    animation: glow-breathe 2.2s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  #avatar-video-wrap img,
  #avatar-video-wrap video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #avatar-video-wrap img { object-position: 35% 20%; }
  #avatar-video-wrap video { object-position: center; }

  #avatar-panel[data-state="speaking"] #avatar-video-wrap {
    box-shadow: 0 0 0 1px var(--accent-dim), 0 0 44px -6px var(--accent-soft), 0 30px 80px -30px rgba(0, 0, 0, 0.75);
  }

  #avatar-state-badge {
    position: absolute;
    bottom: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 0.42rem;
    padding: 0.36rem 0.75rem 0.36rem 0.6rem;
    background: rgba(9, 13, 19, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    font-size: 0; /* raw JS-set text hidden; redisplayed below via ::after, keyed off the same data-state */
  }
  #avatar-state-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--text-dim);
  }
  #avatar-state-badge::after {
    content: "Connecting…";
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text);
  }
  #avatar-panel[data-state="idle"] #avatar-state-badge::before {
    background: var(--accent);
    box-shadow: 0 0 6px 1px var(--accent-soft);
  }
  #avatar-panel[data-state="idle"] #avatar-state-badge::after { content: "Online"; }
  #avatar-panel[data-state="thinking"] #avatar-state-badge::before { background: var(--warn); }
  #avatar-panel[data-state="thinking"] #avatar-state-badge::after { content: "Thinking…"; }
  #avatar-panel[data-state="speaking"] #avatar-state-badge::before {
    background: var(--accent);
    animation: dot-pulse 1s ease-in-out infinite;
  }
  #avatar-panel[data-state="speaking"] #avatar-state-badge::after { content: "Speaking…"; }
  #avatar-panel[data-state="error"] #avatar-state-badge::before { background: var(--danger); }
  #avatar-panel[data-state="error"] #avatar-state-badge::after { content: "Connection issue"; }
  #avatar-panel[data-state="listening"] #avatar-state-badge::before {
    background: var(--accent);
    animation: dot-pulse 1s ease-in-out infinite;
  }
  #avatar-panel[data-state="listening"] #avatar-state-badge::after { content: "Listening…"; }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #eq {
    position: absolute;
    bottom: 16px;
    right: 14px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #avatar-panel[data-state="speaking"] #eq { opacity: 1; }
  #eq span {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: eq-bounce 0.9s ease-in-out infinite;
  }
  #eq span:nth-child(1) { animation-delay: 0s; }
  #eq span:nth-child(2) { animation-delay: 0.15s; }
  #eq span:nth-child(3) { animation-delay: 0.3s; }
  #eq span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes eq-bounce {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  .persona-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    margin-top: 1.1rem;
  }
  .persona-role {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin-top: 0.2rem;
  }

  .voice-label {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .select-wrap {
    position: relative;
    display: inline-block;
  }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--text-dim);
    border-bottom: 1.5px solid var(--text-dim);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  #voice-select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    padding: 0.4rem 1.8rem 0.4rem 0.75rem;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #voice-select:hover { border-color: rgba(255, 255, 255, 0.2); }
  #voice-select:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #voice-select option {
    background: var(--bg-base-2);
    color: var(--text);
  }

  /* ---------- conversation panel ---------- */
  #chat-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-top: 1.5rem;
  }

  #disclaimer {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    background: rgba(232, 179, 74, 0.07);
    border: 1px solid rgba(232, 179, 74, 0.2);
    color: #e9cf9a;
    padding: 0.65rem 0.95rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
    font-size: 0.8rem;
    line-height: 1.45;
    flex-shrink: 0;
  }
  #disclaimer .dot {
    width: 6px;
    height: 6px;
    margin-top: 0.4em;
    border-radius: 50%;
    background: var(--warn);
    flex-shrink: 0;
  }

  #roleplay-setup {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .roleplay-setup-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0;
  }
  .roleplay-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .roleplay-field input[type="text"],
  .roleplay-field select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg-base-2);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius-sm);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .roleplay-field input[type="text"]:focus,
  .roleplay-field select:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .roleplay-field select option {
    background: var(--bg-base-2);
    color: var(--text);
  }
  #start-roleplay-btn {
    align-self: flex-start;
    margin-top: 0.3rem;
    padding: 0.6rem 1.4rem;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #08211d;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  #start-roleplay-btn:hover { transform: scale(1.03); }
  #start-roleplay-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #new-roleplay-btn {
    margin-top: 0.6rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #new-roleplay-btn:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }
  #new-roleplay-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #get-feedback-btn {
    margin-top: 0.6rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #get-feedback-btn:hover:not(:disabled) {
    border-color: var(--accent-dim);
    color: var(--text);
  }
  #get-feedback-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #get-feedback-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #feedback-panel {
    margin-top: 1rem;
    padding: 1rem 1.25rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
  }
  #feedback-panel h3 {
    margin: 0 0 0.75rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    color: var(--accent);
  }
  #feedback-content dt {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 0.75rem;
  }
  #feedback-content dd {
    margin: 0.2rem 0 0;
  }
  #feedback-content .feedback-error {
    color: var(--danger);
  }
  #feedback-close-btn {
    margin-top: 1rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
  }

  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 8px; }
  #chat::-webkit-scrollbar-track { background: transparent; }

  .message {
    display: flex;
    animation: msg-in 0.35s ease both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { justify-content: flex-end; }
  .message.ai {
    justify-content: flex-start;
    align-items: flex-end;
    gap: 0.55rem;
  }
  .message.error { justify-content: center; }
  .message.ai .avatar {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
    object-position: 35% 20%;
    border: 1px solid var(--panel-border);
  }
  .message .bubble {
    max-width: 72%;
    padding: 0.65rem 0.95rem;
    border-radius: var(--radius-sm);
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .message.user .bubble {
    background: var(--accent-soft);
    border: 1px solid rgba(94, 212, 196, 0.28);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }
  .message.ai .bubble {
    background: var(--panel-2);
    border: 1px solid var(--panel-border);
    border-bottom-left-radius: 4px;
  }
  .message.error .bubble {
    background: rgba(226, 104, 91, 0.1);
    border: 1px solid rgba(226, 104, 91, 0.3);
    color: #f1a89e;
    font-size: 0.82rem;
  }

  form#chat-form {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 0.4rem 0.4rem 0.4rem 1.1rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  form#chat-form:focus-within {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #message-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    padding: 0.6rem 0;
  }
  #message-input::placeholder { color: var(--text-dim); }
  #message-input:focus { outline: none; }

  form#chat-form button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #08211d;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  form#chat-form button:hover:not(:disabled) { transform: scale(1.06); }
  form#chat-form button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  form#chat-form button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  form#chat-form button svg {
    width: 17px;
    height: 17px;
  }

  form#chat-form #voice-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: 1px solid var(--panel-border);
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #voice-toggle-btn:hover:not(:disabled) {
    border-color: var(--accent-dim);
    color: var(--text);
  }
  #voice-toggle-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  form#chat-form #voice-toggle-btn[data-active="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #08211d;
  }
  #voice-toggle-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #voice-toggle-btn svg {
    width: 17px;
    height: 17px;
  }

  @media (max-width: 860px) {
    #app-layout {
      flex-direction: column;
      overflow-y: auto;
    }
    #avatar-panel {
      width: 100%;
      max-width: none;
      flex-shrink: 0;
      padding-top: 0.5rem;
    }
    #avatar-video-wrap {
      max-width: 260px;
      aspect-ratio: 1 / 1;
    }
    #chat-panel {
      min-height: 62vh;
      padding-top: 1.5rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <header id="brand">
    <span class="mark"></span>
    <span class="wordmark">Mini <em>ECHO</em></span>
  </header>

  <div id="app-layout">
    <div id="avatar-panel" data-state="connecting">
      <div id="avatar-video-wrap">
        <div id="avatar-glow"></div>
        <img id="avatar-poster" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
        <video id="avatar-video" autoplay playsinline hidden></video>
        <audio id="avatar-audio" autoplay></audio>
        <span id="avatar-state-badge">connecting</span>
        <div id="eq"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="persona-name" id="active-persona-name">Dr. Sarah Chen</div>
      <div class="persona-role" id="active-persona-role">General Practitioner</div>
      <button type="button" id="new-roleplay-btn" hidden>New Roleplay</button>
      <button type="button" id="get-feedback-btn" hidden disabled>Get Feedback</button>
      <label class="voice-label">Voice
        <span class="select-wrap"><select id="voice-select"></select></span>
      </label>
    </div>

    <div id="chat-panel">
      <div id="disclaimer">
        <span class="dot"></span>
        This is an AI roleplay for practice only — not real medical advice. In a real emergency, contact emergency services immediately.
      </div>
      <form id="roleplay-setup">
        <h2 class="roleplay-setup-title">Start a Roleplay</h2>
        <label class="roleplay-field">HCP Persona
          <span class="select-wrap"><select id="persona-select"></select></span>
        </label>
        <label class="roleplay-field">Scenario
          <input id="scenario-input" type="text" placeholder="e.g. Pharmaceutical sales call" required>
        </label>
        <label class="roleplay-field">Conversation Objective
          <input id="objective-input" type="text" placeholder="e.g. Introduce a new treatment and handle objections" required>
        </label>
        <label class="roleplay-field">Persona Mood / Behavior
          <input id="mood-input" type="text" placeholder="e.g. Skeptical, short on time" required>
        </label>
        <label class="roleplay-field">Difficulty
          <span class="select-wrap">
            <select id="difficulty-select">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </span>
        </label>
        <button type="submit" id="start-roleplay-btn">Start Roleplay</button>
      </form>
      <div id="chat" style="display: none;"></div>
      <form id="chat-form" style="display: none;">
        <button type="button" id="voice-toggle-btn" aria-label="Toggle live voice conversation" data-active="false">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </form>
      <div id="feedback-panel" style="display: none;">
        <h3>Performance Feedback</h3>
        <div id="feedback-content"></div>
        <button type="button" id="feedback-close-btn">Close</button>
      </div>
    </div>
  </div>

  <template id="avatar-template">
    <img class="avatar" src="/static/avatar.jpg" alt="Dr. Sarah Chen">
  </template>

  <script src="/static/dist/avatar-bundle.js"></script>
  <script src="/static/stt-web-speech.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const button = form.querySelector('button[type="submit"]');
    const avatarTemplate = document.getElementById('avatar-template');
    const voiceSelect = document.getElementById('voice-select');
    const avatarVideo = document.getElementById('avatar-video');
    const avatarAudio = document.getElementById('avatar-audio');
    const avatarPoster = document.getElementById('avatar-poster');
    const avatarPanel = document.getElementById('avatar-panel');
    const avatarStateBadge = document.getElementById('avatar-state-badge');
    const roleplaySetupForm = document.getElementById('roleplay-setup');
    const personaSelect = document.getElementById('persona-select');
    const scenarioInput = document.getElementById('scenario-input');
    const objectiveInput = document.getElementById('objective-input');
    const moodInput = document.getElementById('mood-input');
    const difficultySelect = document.getElementById('difficulty-select');
    const newRoleplayBtn = document.getElementById('new-roleplay-btn');
    const getFeedbackBtn = document.getElementById('get-feedback-btn');
    const feedbackPanel = document.getElementById('feedback-panel');
    const feedbackContent = document.getElementById('feedback-content');
    const feedbackCloseBtn = document.getElementById('feedback-close-btn');

    function updateFeedbackButtonState() {
      getFeedbackBtn.disabled = isSending || conversation.length === 0;
    }
    const activePersonaName = document.getElementById('active-persona-name');
    const activePersonaRole = document.getElementById('active-persona-role');
    const startRoleplayBtn = document.getElementById('start-roleplay-btn');
    let isSending = false;
    let conversation = [];
    let voices = [];
    let personas = [];
    let roleplaySession = null;

    console.log('[page] MiniEchoAvatar bundle loaded:', typeof MiniEchoAvatar !== 'undefined');

    const avatar = new MiniEchoAvatar.DoctorAvatar({
      videoEl: avatarVideo,
      audioEl: avatarAudio,
      panelEl: avatarPanel,
      stateEl: avatarStateBadge,
    });

    avatarVideo.addEventListener('playing', () => {
      console.log('[page] video element fired "playing" — showing live video, hiding poster');
      console.log('[page] video diagnostics:', {
        readyState: avatarVideo.readyState,
        paused: avatarVideo.paused,
        videoWidth: avatarVideo.videoWidth,
        videoHeight: avatarVideo.videoHeight,
        srcObject: avatarVideo.srcObject,
        tracks: avatarVideo.srcObject
          ? avatarVideo.srcObject.getVideoTracks().map((t) => ({
              readyState: t.readyState,
              muted: t.muted,
              enabled: t.enabled,
            }))
          : null,
      });
      // Inline styles always win over any external stylesheet rule,
      // regardless of CSS specificity — avoids repeating the earlier bug
      // where a same-specificity rule silently overrode `hidden`.
      avatarVideo.style.display = 'block';
      avatarPoster.style.display = 'none';

      let checks = 0;
      const progressCheck = setInterval(() => {
        checks += 1;
        console.log('[page] video frame-progress check', checks, '— currentTime:', avatarVideo.currentTime.toFixed(2));
        if (checks >= 5) clearInterval(progressCheck);
      }, 1000);
    });
    avatarVideo.addEventListener('error', (event) => {
      console.error('[page] video element error:', avatarVideo.error, event);
    });
    avatarAudio.addEventListener('play', () => {
      console.log('[page] audio element started playing');
    });
    avatarAudio.addEventListener('error', (event) => {
      console.error('[page] audio element error:', avatarAudio.error, event);
    });

    avatar.connect();

    async function populateVoices() {
      try {
        const response = await fetch('/voices');
        if (!response.ok) throw new Error('Failed to load voices');
        voices = await response.json();
      } catch (error) {
        console.error('Failed to load voices', error);
        voices = [];
      }

      voiceSelect.replaceChildren();
      voices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voice_id;
        option.textContent = voice.name;
        voiceSelect.appendChild(option);
      });

      const savedVoiceId = localStorage.getItem('voiceId');
      if (savedVoiceId && voices.some((v) => v.voice_id === savedVoiceId)) {
        voiceSelect.value = savedVoiceId;
      }
    }

    voiceSelect.addEventListener('change', () => {
      localStorage.setItem('voiceId', voiceSelect.value);
    });

    populateVoices();

    async function populatePersonas() {
      try {
        const response = await fetch('/personas');
        if (!response.ok) throw new Error('Failed to load personas');
        personas = await response.json();
      } catch (error) {
        console.error('Failed to load personas', error);
        personas = [];
      }

      personaSelect.replaceChildren();

      if (personas.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Could not load personas — please refresh the page';
        personaSelect.appendChild(option);
        startRoleplayBtn.disabled = true;
        return;
      }

      personas.forEach((persona) => {
        const option = document.createElement('option');
        option.value = persona.id;
        option.textContent = persona.name + ' — ' + persona.role_title;
        personaSelect.appendChild(option);
      });
    }

    populatePersonas();

    roleplaySetupForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const selectedPersona = personas.find((p) => p.id === personaSelect.value);
      if (!selectedPersona) return;

      const scenario = scenarioInput.value.trim();
      const objective = objectiveInput.value.trim();
      const mood = moodInput.value.trim();
      if (!scenario || !objective || !mood) return;

      roleplaySession = {
        persona_id: selectedPersona.id,
        scenario,
        objective,
        mood,
        difficulty: difficultySelect.value,
      };

      if (selectedPersona.voice_id && voices.some((v) => v.voice_id === selectedPersona.voice_id)) {
        voiceSelect.value = selectedPersona.voice_id;
        localStorage.setItem('voiceId', selectedPersona.voice_id);
      }

      activePersonaName.textContent = selectedPersona.name;
      activePersonaRole.textContent = selectedPersona.role_title;

      roleplaySetupForm.style.display = 'none';
      chat.style.display = 'flex';
      form.style.display = 'flex';
      newRoleplayBtn.hidden = false;
      getFeedbackBtn.hidden = false;
      updateFeedbackButtonState();
    });

    newRoleplayBtn.addEventListener('click', () => {
      if (isSending) return;
      if (stt) stopVoiceMode();

      roleplaySession = null;
      conversation = [];
      chat.replaceChildren();
      activePersonaName.textContent = '';
      activePersonaRole.textContent = '';

      roleplaySetupForm.style.display = 'flex';
      chat.style.display = 'none';
      form.style.display = 'none';
      newRoleplayBtn.hidden = true;
      getFeedbackBtn.hidden = true;
      feedbackPanel.style.display = 'none';
      updateFeedbackButtonState();
    });

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'ai') {
        div.appendChild(avatarTemplate.content.cloneNode(true));
      }

      const bubble = document.createElement('span');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendToSarah(message) {
      if (isSending) return;
      if (!message) return;

      isSending = true;
      input.disabled = true;
      button.disabled = true;
      if (stt) stt.stop();

      try {
        conversation.push({ role: 'user', content: message });
        addMessage(message, 'user');
        avatar.think();

        const chatRequestBody = { messages: conversation };
        if (roleplaySession) {
          chatRequestBody.session = roleplaySession;
        }

        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(chatRequestBody),
        });

        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }

        const data = await response.json();
        conversation.push({ role: 'assistant', content: data.reply });
        addMessage(data.reply, 'ai');
        avatar.speak(data.reply, voiceSelect.value);
      } catch (error) {
        conversation.pop();
        addMessage('Something went wrong. Please try again.', 'error');
        if (avatarPanel.dataset.state !== 'idle') {
          avatarPanel.dataset.state = 'idle';
          avatarStateBadge.textContent = 'idle';
        }
      } finally {
        isSending = false;
        input.disabled = false;
        button.disabled = false;
        input.focus();
        updateFeedbackButtonState();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      sendToSarah(message);
    });

    getFeedbackBtn.addEventListener('click', async () => {
      getFeedbackBtn.disabled = true;
      const originalText = getFeedbackBtn.textContent;
      getFeedbackBtn.textContent = 'Evaluating…';

      try {
        const response = await fetch('/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation, session: roleplaySession }),
        });

        if (!response.ok) {
          throw new Error('Evaluation request failed with status ' + response.status);
        }

        const result = await response.json();
        feedbackContent.replaceChildren();
        const dl = document.createElement('dl');
        const fields = [
          ['Message Accuracy', result.dimensions.message_accuracy],
          ['Objection Handling', result.dimensions.objection_handling],
          ['Rapport Building', result.dimensions.rapport_building],
          ['Compliance Adherence', result.dimensions.compliance_adherence],
          ['Overall Summary', result.overall_summary],
          ['Improvement Recommendations', result.improvement_recommendations],
        ];
        fields.forEach(([label, value]) => {
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.textContent = value;
          dl.appendChild(dt);
          dl.appendChild(dd);
        });
        feedbackContent.appendChild(dl);
      } catch (error) {
        feedbackContent.replaceChildren();
        const errorLine = document.createElement('p');
        errorLine.className = 'feedback-error';
        errorLine.textContent = 'Something went wrong generating feedback. Please try again.';
        feedbackContent.appendChild(errorLine);
      } finally {
        feedbackPanel.style.display = 'block';
        getFeedbackBtn.textContent = originalText;
        updateFeedbackButtonState();
      }
    });

    feedbackCloseBtn.addEventListener('click', () => {
      feedbackPanel.style.display = 'none';
    });

    const voiceToggleBtn = document.getElementById('voice-toggle-btn');
    let voiceModeActive = false;
    let noSpeechRestartPending = false;

    const stt = (window.MiniEchoSTT && window.MiniEchoSTT.WebSpeechSTT.isSupported)
      ? new window.MiniEchoSTT.WebSpeechSTT({
          onFinalResult: (transcript) => {
            stt.stop();
            sendToSarah(transcript);
          },
          onError: (error) => {
            if (error === 'no-speech' && voiceModeActive) {
              console.log('[page] no speech detected, will listen again once recognition fully stops');
              noSpeechRestartPending = true;
              return;
            }
            console.warn('[page] voice mode stopped due to STT error:', error);
            voiceModeActive = false;
            voiceToggleBtn.dataset.active = 'false';
            if (avatarPanel.dataset.state === 'listening') {
              avatarPanel.dataset.state = 'idle';
              avatarStateBadge.textContent = 'idle';
            }
            addMessage(
              error === 'not-allowed'
                ? 'Voice mode stopped: microphone permission denied.'
                : 'Voice mode stopped: speech recognition error.',
              'error',
            );
          },
          onListeningChange: (isListening) => {
            if (!isListening && noSpeechRestartPending) {
              noSpeechRestartPending = false;
              stt.start();
            }
          },
        })
      : null;

    if (!stt) {
      voiceToggleBtn.disabled = true;
      voiceToggleBtn.title = 'Live voice mode requires a browser with SpeechRecognition support (e.g. desktop Chrome)';
    } else {
      function startListeningIfStillIdle() {
        if (!voiceModeActive) return;
        if (avatarPanel.dataset.state !== 'idle') return;
        setTimeout(() => {
          if (voiceModeActive && avatarPanel.dataset.state === 'idle') {
            avatarPanel.dataset.state = 'listening';
            avatarStateBadge.textContent = 'listening';
            stt.start();
          }
        }, 300);
      }

      function stopVoiceMode() {
        voiceModeActive = false;
        voiceToggleBtn.dataset.active = 'false';
        stt.stop();
        noSpeechRestartPending = false;
        if (avatarPanel.dataset.state === 'listening' || avatarPanel.dataset.state === 'error') {
          avatarPanel.dataset.state = 'idle';
          avatarStateBadge.textContent = 'idle';
        }
      }

      voiceToggleBtn.addEventListener('click', () => {
        if (voiceModeActive) {
          stopVoiceMode();
        } else {
          voiceModeActive = true;
          voiceToggleBtn.dataset.active = 'true';
          startListeningIfStillIdle();
        }
      });

      const voiceStateObserver = new MutationObserver(() => {
        startListeningIfStillIdle();
      });
      voiceStateObserver.observe(avatarPanel, { attributes: true, attributeFilter: ['data-state'] });
    }
  </script>
</body>
</html>
